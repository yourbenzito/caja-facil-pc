<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizando Sistema de Ventas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .progress-container {
            width: 300px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 1rem auto;
        }
        .progress-bar {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.3s ease;
        }
        .status {
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        .complete {
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Descargando Actualización</h1>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status" id="status">Preparando descarga...</div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        const progressBar = document.getElementById('progressBar');
        const status = document.getElementById('status');

        ipcRenderer.on('update-progress', (event, progress) => {
            progressBar.style.width = progress + '%';
            status.textContent = `Descargando... ${Math.round(progress)}%`;
        });

        ipcRenderer.on('update-complete', () => {
            progressBar.style.width = '100%';
            status.textContent = '✅ Descarga completada';
            status.classList.add('complete');
        });
    </script>
</body>
</html>
