    <script>
        // Nombre del negocio en sidebar (splash lo controla app.js)
        window.addEventListener('load', () => {
            try {
                const businessData = localStorage.getItem('CURRENT_BUSINESS');
                if (businessData) {
                    const business = JSON.parse(businessData);
                    const sidebarName = document.getElementById('sidebar-business-name');
                    if (sidebarName && business.name) {
                        sidebarName.textContent = '🛒 ' + business.name;
                    }
                }
            } catch (e) { }
        });

        // Monitorear estado de red
        window.addEventListener('online', () => {
            const indicator = document.getElementById('online-indicator');
            if (indicator) indicator.innerHTML = '🟢 Sistema Local Listo';
        });

        window.addEventListener('offline', () => {
            const indicator = document.getElementById('online-indicator');
            if (indicator) indicator.innerHTML = '🟢 Sistema Local (Sin Internet)';
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            if (sidebar) sidebar.classList.toggle('active');
            if (overlay) overlay.style.display = sidebar && sidebar.classList.contains('active') ? 'block' : 'none';
        }
    </script>
